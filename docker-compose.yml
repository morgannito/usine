version: '3.8'

services:
  usine-game:
    build:
      context: .
      dockerfile: Dockerfile
    image: usine-factory-game:latest
    container_name: usine-game
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - usine-network

networks:
  usine-network:
    driver: bridge
